name: habit_tracker_dashboard
description: A Flutter habit tracker dashboard application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  fl_chart: ^1.1.1
  intl: ^0.20.2
  csv: ^6.0.0
  file_picker: ^10.3.7
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
